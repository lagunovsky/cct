[package]
name = "cct"
version = "0.2.0"
edition = "2021"
description = "Claude Code Tools — full-text search across Claude Code sessions, plus rename/move utilities."

[lib]
name = "cct"
path = "src/lib.rs"

[[bin]]
name = "cct"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tantivy = "0.26"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.27"
dirs = "5"
unicode-width = "0.2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
exclude = ["experiments/tantivy-probe"]
